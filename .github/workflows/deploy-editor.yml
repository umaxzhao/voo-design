name: Verify and deploy editor to la2
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Required secret: LA2_SSH_KEY (deployment private key).
# Required secret: LA2_SSH_HOST (la2 address).
# Optional secret: LA2_SSH_USER (default root).
concurrency:
  group: deploy-editor-la2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy_enabled: ${{ steps.secrets.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:modules
      - run: npm run lint:design
      - run: npm run build
      - name: Install Linux window-test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openbox xvfb xdotool
      - name: Verify actual Linux desktop chrome
        env:
          VOO_WINDOW_ARTIFACT_DIR: ${{ runner.temp }}/voo-window-evidence
        run: |
          mkdir -p "$VOO_WINDOW_ARTIFACT_DIR"
          xvfb-run -a -s '-screen 0 1600x1000x24' bash -c '
            openbox > "$VOO_WINDOW_ARTIFACT_DIR/openbox.log" 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid" EXIT
            node tests/e2e/desktop-window-native.e2e.mjs
          '
      - name: Upload Linux window-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-window-evidence
          path: ${{ runner.temp }}/voo-window-evidence/
          if-no-files-found: ignore
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: editor-dist
          path: dist/
          if-no-files-found: error
      # Secrets cannot be referenced directly in a job-level if expression.
      - name: Check deployment configuration
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: secrets
        env:
          LA2_SSH_KEY: ${{ secrets.LA2_SSH_KEY }}
          LA2_SSH_HOST: ${{ secrets.LA2_SSH_HOST }}
        run: |
          if [ -n "$LA2_SSH_KEY" ] && [ -n "$LA2_SSH_HOST" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: build
    if: needs.build.outputs.deploy_enabled == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/download-artifact@v4
        with:
          name: editor-dist
          path: dist/
      - name: Configure SSH
        env:
          LA2_SSH_KEY: ${{ secrets.LA2_SSH_KEY }}
          LA2_SSH_HOST: ${{ secrets.LA2_SSH_HOST }}
          LA2_SSH_USER: ${{ secrets.LA2_SSH_USER || 'root' }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$LA2_SSH_KEY" > ~/.ssh/la2_deploy_key
          ssh-keyscan -H "$LA2_SSH_HOST" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host la2
            HostName $LA2_SSH_HOST
            User $LA2_SSH_USER
            IdentityFile ~/.ssh/la2_deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
          EOF
      - name: Publish verified client model weights
        run: bash scripts/deploy-editor-models.sh --client
      - name: Deploy editor artifact
        env:
          VOO_DEPLOY_SKIP_BUILD: '1'
        run: bash scripts/deploy-editor.sh
      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/la2_deploy_key
