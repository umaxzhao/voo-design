name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_draft:
        description: Assemble a draft prerelease after all native checks pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Fail early on Linux raster differences and host-installed CLI assumptions.
      # The complete gate below retains these same assertions and evidence.
      - name: Check Linux text and offline menu parity
        run: |
          node tests/e2e/html2nodes.e2e.mjs
          node tests/e2e/ui-responsive-editor.e2e.mjs
        env:
          VOO_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/desktop-browser-evidence
      - run: node scripts/verify-editor-release.mjs
        env:
          GOMAXPROCS: '1'
          VITEST_MAX_FORKS: '2'
          VITEST_MIN_FORKS: '1'
          VOO_RELEASE_BROWSER_CONCURRENCY: '2'
          VOO_RELEASE_REPORT: ${{ runner.temp }}/desktop-web-release.json
          VOO_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/desktop-browser-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-gate-evidence
          path: |
            ${{ runner.temp }}/desktop-web-release.json
            ${{ runner.temp }}/desktop-browser-evidence/**
          if-no-files-found: error
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: windows-2025
            platform: win
            arch: x64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm
      - run: npm ci
      - name: Package on the native architecture
        env:
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run release:build -- ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Native packaged smoke (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run -a npm run release:smoke -- linux x64
      - name: Native packaged smoke (macOS and Windows)
        if: matrix.platform != 'linux'
        run: npm run release:smoke -- ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/beta*.yml
            release/alpha*.yml
            release/latest*.yml
            release/evidence/*
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/evidence/*
          if-no-files-found: ignore
  draft:
    needs: [checks, build]
    if: startsWith(github.ref, 'refs/tags/') || inputs.create_draft
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop-artifacts
      - run: node scripts/assemble-desktop-release.mjs desktop-artifacts release-ready
      - name: Create complete draft only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Version tag differs from package.json" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace existing assets" >&2
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --draft --prerelease \
            --title "VOO Design $VERSION" --notes-file release-ready/RELEASE-NOTES.md
          gh release upload "$TAG" release-ready/*
