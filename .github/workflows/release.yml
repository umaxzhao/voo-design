name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_mac:
        description: Build macOS (unsigned when secrets are absent)
        type: boolean
        default: false
      build_win:
        description: Build Windows (unsigned when secrets are absent)
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: release/*.AppImage
          if-no-files-found: error
      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/*.AppImage --clobber
  desktop:
    if: ${{ inputs.build_mac || inputs.build_win }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: (matrix.platform == 'mac' && inputs.build_mac) || (matrix.platform == 'win' && inputs.build_win)
      - name: Package desktop
        if: (matrix.platform == 'mac' && inputs.build_mac) || (matrix.platform == 'win' && inputs.build_win)
        env:
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build && node scripts/signing-env.mjs --${{ matrix.platform }} --publish never
      - uses: actions/upload-artifact@v4
        if: (matrix.platform == 'mac' && inputs.build_mac) || (matrix.platform == 'win' && inputs.build_win)
        with:
          name: ${{ matrix.platform }}-installers
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
