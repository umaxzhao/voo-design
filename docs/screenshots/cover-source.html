<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VOO Design — Repository cover</title>
    <style>
      @font-face {
        font-family: "Intel One Mono";
        src: url("../../public/fonts/intel-one-mono-regular.woff2") format("woff2");
        font-style: normal;
        font-weight: 400;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: transparent; }
      body { color: #f4f2e9; font-family: "Intel One Mono", monospace; }
      main {
        position: relative;
        width: 1800px;
        height: 1400px;
        overflow: hidden;
        border-radius: 32px;
        background: linear-gradient(125deg, #173d30 0%, #352448 100%);
      }
      .brand {
        position: absolute;
        top: 52px;
        left: 76px;
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 30px;
        font-weight: 400;
      }
      .brand img { width: 64px; height: 64px; }
      .meta {
        position: absolute;
        top: 74px;
        right: 76px;
        margin: 0;
        font-size: 16px;
        letter-spacing: 1px;
        color: #c9c5d2;
      }
      h1 {
        position: absolute;
        top: 154px;
        left: 76px;
        margin: 0;
        font-size: 64px;
        line-height: 1.15;
        font-weight: 400;
        letter-spacing: -2px;
        white-space: nowrap;
      }
      .subtitle {
        position: absolute;
        top: 252px;
        left: 80px;
        display: flex;
        gap: 32px;
        margin: 0;
        font-size: 22px;
        color: #d5d1dd;
        line-height: 1.6;
      }
      .editor {
        position: absolute;
        top: 332px;
        left: 76px;
        display: block;
        width: 1648px;
        height: 1030px;
        border-radius: 24px;
        box-shadow: 0 16px 56px #32244826;
      }
      @media (max-width: 1280px) {
        main { width: 1280px; height: 640px; border-radius: 24px; }
        .brand { top: 36px; left: 52px; font-size: 24px; gap: 14px; }
        .brand img { width: 52px; height: 52px; }
        .meta { top: 54px; right: 52px; font-size: 12px; }
        h1 { top: 136px; left: 52px; font-size: 46px; letter-spacing: -1.5px; }
        .subtitle { top: 278px; left: 56px; display: block; font-size: 19px; line-height: 1.9; }
        .subtitle span { display: block; }
        .editor { top: 246px; left: 624px; width: 600px; height: 375px; border-radius: 12px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><img src="../../build/icon.png" alt="VOO App Icon" />VOO Design</div>
      <p class="meta">DESKTOP · WEB · MCP</p>
      <h1>AI agent-driven design editor.</h1>
      <p class="subtitle"><span>Standalone app.</span><span>Claude Code + Codex via MCP.</span></p>
      <img class="editor" src="ui-editor.png" alt="VOO editing a music interface with a text layer selected" />
    </main>
  </body>
</html>
