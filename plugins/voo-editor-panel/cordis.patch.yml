# voo-editor-panel bundle patch.
#
# One Host row serves the built VOO editor on a loopback origin and (unless a
# VOO bridge is already running) starts the local CLI bridge the editor links
# to. The Client half registers the right-Sidebar tab that hosts the editor.
#
# `port` is fixed at 4173 by default because the VOO CLI bridge only accepts a
# fixed origin allowlist that includes http://127.0.0.1:4173; the Client half
# loads that origin. Changing the port also makes the editor unlinkable from
# the bridge unless the bridge's VOO_CLI_BRIDGE_ORIGINS is extended too.
- insert:
    - id: voo-editor-panel
      name: voo-editor-panel
      config:
        port: 4173
        # Empty: resolve <package>/../../dist (the repository build). Set an
        # absolute path to serve a build that lives elsewhere.
        editorDir: ''
        # Start the local VOO CLI bridge when nothing is listening on 4179, so
        # the panel editor links to the same canvas the agent tools drive.
        bridge: true
