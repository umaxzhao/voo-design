# Include inside the HTTPS VOO server block. ORT imports .mjs modules strictly.
location ^~ /editor/ort/ {
    root /srv/voo-run/current/web/public;
    types {
        application/javascript js mjs;
        application/wasm wasm;
    }
    default_type application/octet-stream;
    expires -1;
    try_files $uri =404;
}
